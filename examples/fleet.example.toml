# SSHFleet fleet inventory example.
# Copy to ./fleet.toml or ~/.config/sshfleet/fleet.toml and edit.

[defaults]
# Credentials used unless a host overrides them.
user = "deploy"
port = 22
identity_file = "~/.ssh/id_ed25519"

# Polling behaviour.
interval = 10        # seconds between poll cycles
timeout = 8          # timeout for each connection attempt and probe command
max_concurrent = 8   # upper bound of simultaneous probes

# Colour thresholds (percent) for CPU / MEM / DISK / LOAD columns.
warn_pct = 70
crit_pct = 88

# Resolve host entries through ~/.ssh/config, exactly like `ssh alias`:
# aliases, HostName, User, Port, IdentityFile and ProxyJump all apply.
# Hosts listed here without an explicit user/port/key fall back to it.
import_ssh_config = true

# Verify server host keys against ~/.ssh/known_hosts. Set false only on
# trusted networks where servers are rebuilt frequently.
verify_hosts = true

# Password auth is supported but discouraged: it sits in this file as
# plaintext, so prefer keys or an ssh-agent. If you must, restrict the file:
#   chmod 600 fleet.toml
# password = "s3cr3t"

[[hosts]]
name = "edge-fra-01"
host = "edge-fra-01"

# Plain address without any ~/.ssh/config entry:
[[hosts]]
host = "app.internal.lan"
user = "admin"

[[hosts]]
name = "legacy-nas"
host = "nas.lan"
user = "operator"
password = "only-when-there-is-no-other-way"

[[hosts]]
name = "db-primary"
host = "db.internal.lan"
port = 2222
identity_file = "~/.ssh/db_ed25519"
